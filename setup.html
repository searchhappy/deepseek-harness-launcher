<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness - 安装向导</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 700px;
      overflow: hidden;
    }

    header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 2em;
      margin-bottom: 10px;
    }

    .content {
      padding: 30px;
    }

    .step {
      margin-bottom: 20px;
      padding: 20px;
      border: 2px solid #e9ecef;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .step.checking {
      border-color: #ffc107;
      background: #fff8e1;
    }

    .step.success {
      border-color: #28a745;
      background: #d4edda;
    }

    .step.error {
      border-color: #dc3545;
      background: #f8d7da;
    }

    .step-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .step-title {
      font-weight: 600;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-icon {
      font-size: 1.5em;
    }

    .step-message {
      color: #666;
      margin-top: 10px;
      font-size: 0.9em;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
      color: white;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 30px;
      justify-content: center;
    }

    .btn-large {
      padding: 15px 40px;
      font-size: 1.1em;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e9ecef;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.5s ease;
    }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🚀 DeepSeek Harness 安装向导</h1>
      <p>自动检测并安装所需环境</p>
    </header>

    <div class="content">
      <div id="step-nodejs" class="step">
        <div class="step-header">
          <div class="step-title">
            <span class="status-icon">⏳</span>
            <span>Node.js 环境</span>
          </div>
        </div>
        <div class="step-message">正在检查...</div>
      </div>

      <div id="step-dsh" class="step">
        <div class="step-header">
          <div class="step-title">
            <span class="status-icon">⏳</span>
            <span>DeepSeek Harness</span>
          </div>
        </div>
        <div class="step-message">等待 Node.js 检查完成...</div>
      </div>

      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
      </div>

      <div class="action-buttons" id="action-buttons" style="display: none;">
        <button class="btn btn-primary btn-large" id="launch-btn">
          启动 DeepSeek Harness
        </button>
      </div>
    </div>
  </div>

  <script src="setup.js"></script>
</body>
</html>
