name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'main/package-lock.json'

      - name: Install dependencies
        run: |
          cd main
          npm install

      - name: Build Standard NSIS Installer
        run: |
          cd main
          npm run build:nsis

      - name: Build Setup NSIS Installer
        run: |
          cd main
          npm run build:nsis-setup

      - name: Upload Standard Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-standard-installer
          path: dist-installer/*.exe

      - name: Upload Setup Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-setup-installer
          path: dist-setup-installer/*.exe

  build-macos:
    name: Build macOS Installers
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'main/package-lock.json'

      - name: Install dependencies
        run: |
          cd main
          npm install

      - name: Build Standard DMG
        run: |
          cd main
          npm run build:mac

      - name: Build Setup DMG
        run: |
          cd main
          npm run build:mac-setup

      - name: Upload Standard DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-standard-installer
          path: dist-installer/*.dmg

      - name: Upload Setup DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-setup-installer
          path: dist-setup-installer/*.dmg

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-standard-installer/*
            artifacts/windows-setup-installer/*
            artifacts/macos-standard-installer/*
            artifacts/macos-setup-installer/*
          draft: false
          prerelease: false
          body: |
            ## 🚀 DeepSeek Harness Launcher ${{ github.ref_name }}

            ### 📥 下载

            #### Windows 用户
            - **标准版**: `DeepSeekHarness-Installer-*.exe` (适合开发者)
            - **智能安装版**: `DeepSeekHarness-Setup-Installer-*.exe` (适合新手)

            #### macOS 用户
            - **Intel 芯片**: `*-x64.dmg`
            - **Apple Silicon (M1/M2/M3)**: `*-arm64.dmg`

            ### ✨ 更新内容

            - 新增完整的 NSIS 安装程序支持
            - 新增 macOS DMG 安装程序
            - 支持自动创建快捷方式
            - 支持卸载程序

            ### 📖 安装说明

            #### Windows
            1. 下载对应的 `.exe` 文件
            2. 双击运行安装程序
            3. 按照向导完成安装

            #### macOS
            1. 下载对应芯片的 `.dmg` 文件
            2. 打开 DMG 文件
            3. 将应用拖到"应用程序"文件夹

            ### 📋 系统要求

            - **Windows**: Windows 10/11 (64位)
            - **macOS**: macOS 10.13+ (High Sierra 或更高)
            - **Node.js**: v16.0.0 或更高版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
